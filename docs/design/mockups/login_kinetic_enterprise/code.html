<body class="bg-background min-h-screen flex items-center justify-center p-md font-body-md text-on-background">
<!-- Centered Card Container -->
<main class="w-full max-w-[400px] bg-surface-container-lowest rounded-xl border border-outline-variant p-xl shadow-[0px_10px_15px_-3px_rgba(0,0,0,0.1)] flex flex-col gap-lg">
<!-- Header -->
<header class="text-center flex flex-col gap-sm items-center">
<div class="w-12 h-12 bg-primary rounded-lg flex items-center justify-center mb-sm">
<span class="material-symbols-outlined text-on-primary text-[24px]">view_in_ar</span>
</div>
<h1 class="font-headline-md text-headline-md text-on-background">Sign In</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Welcome back to AdPrecision CRM</p>
</header>
<!-- Form -->
<form action="#" class="flex flex-col gap-md" method="POST">
<div class="flex flex-col gap-xs">
<label class="font-label-md text-label-md text-on-background" for="email">Email Address</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-on-surface-variant text-[20px]">mail</span>
<input class="w-full bg-surface border border-outline-variant rounded-lg pl-10 pr-md py-[10px] font-body-md text-body-md text-on-background focus:border-secondary focus:ring-2 focus:ring-secondary/20 transition-all outline-none" id="email" name="email" placeholder="name@agency.com" required="" type="email"/>
</div>
</div>
<div class="flex flex-col gap-xs">
<div class="flex justify-between items-center">
<label class="font-label-md text-label-md text-on-background" for="password">Password</label>
<a class="font-label-sm text-label-sm text-secondary hover:text-on-secondary-container transition-colors" href="#">Forgot password?</a>
</div>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-on-surface-variant text-[20px]">lock</span>
<input class="w-full bg-surface border border-outline-variant rounded-lg pl-10 pr-md py-[10px] font-body-md text-body-md text-on-background focus:border-secondary focus:ring-2 focus:ring-secondary/20 transition-all outline-none" id="password" name="password" placeholder="••••••••" required="" type="password"/>
</div>
</div>
<!-- Notice for first-time login -->
<div class="bg-surface-container-low p-sm rounded-lg flex items-start gap-sm mt-xs border border-outline-variant/50">
<span class="material-symbols-outlined text-secondary text-[18px] mt-0.5">info</span>
<p class="font-label-sm text-label-sm text-on-surface-variant">
                    Security Policy: You will be required to update your password upon first successful authentication.
                </p>
</div>
<!-- Submit Button -->
<button class="w-full bg-secondary hover:bg-on-secondary-container text-on-secondary font-label-md text-label-md py-3 rounded-lg transition-colors flex items-center justify-center gap-sm mt-sm" type="submit">
                Sign In
                <span class="material-symbols-outlined text-[18px]">arrow_forward</span>
</button>
</form>
<!-- Footer -->
<footer class="text-center pt-md border-t border-outline-variant/50">
<p class="font-label-sm text-label-sm text-on-surface-variant">
                Secure access provided by AdPrecision Security
            </p>
</footer>
</main>
</body></html>
